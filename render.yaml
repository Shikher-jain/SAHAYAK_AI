services:
  # 1. React Frontend (Free Static Site)
  - type: static_site
    name: sahayak-frontend
    env: static
    # Assuming Vite. Change to 'npm run build' and 'build' if using Create React App.
    buildCommand: cd sahayak-ui && npm install && npm run build
    staticPublishPath: sahayak-ui/dist 
    routes:
      # Prevents 404 errors on page refreshes by routing everything to React
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Automatically links the deployed backend URL to your frontend
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sahayak-backend
          envVarKey: RENDER_EXTERNAL_URL

  # 2. FastAPI Backend (Free Tier Web Service)
  - type: web
    name: sahayak-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # CRITICAL: --workers 1 ensures you do not exceed the 512MB RAM limit
    startCommand: uvicorn sahayak_ai_v3.backend.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: SAHAYAK_PIPELINE_VERSION
        value: v2_advanced
      - key: PYTHON_VERSION
        value: 3.11.0 # Specify Python version to prevent build inconsistencies
      
      # The following are explicitly set to NOT sync. 
      # You must paste the actual values in the Render Dashboard securely.
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: UPSTASH_VECTOR_REST_URL
        sync: false
      - key: UPSTASH_VECTOR_REST_TOKEN
        sync: false
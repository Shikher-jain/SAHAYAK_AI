name: External Total Outage Monitor (Keep-Alive)

on:
  schedule:
    # Run every 5 minutes to prevent Render from spinning down and check health
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-server:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Deep Health Ping Endpoint
        id: ping
        run: |
          # Render Free Tier cold-starts can take 30-90s.
          # Retry up to 3 times with a generous timeout to handle this.
          for i in 1 2 3; do
            echo "Attempt $i/3..."
            if curl -f -s -S --max-time 120 "${{ secrets.RENDER_EXTERNAL_URL }}/api/v2/health/deep-ping"; then
              echo "✅ Server is healthy!"
              exit 0
            fi
            echo "⚠️ Attempt $i failed. Waiting 10s before retry..."
            sleep 10
          done
          echo "❌ All 3 attempts failed."
          exit 1
          
      - name: Send Telegram Alert on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.ALERT_TELEGRAM_CHAT_ID }}" \
          -d text="🚨 CRITICAL: Sahayak AI Render backend is down or unreachable. GitHub Actions health ping failed (HTTP 502/503 or Timeout)."
